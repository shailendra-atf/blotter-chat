services:
  api-server-1:
    build: .
    command: python -m mcp_server.mcp_web_app
    ports:
      - "8050:8050"
    volumes:
      - .:/app
    environment:
      - ENV=production

  api-server-2:
    build: .
    command: uv run uvicorn src_mcp.app:app --host 0.0.0.0 --port 9999
    ports:
      - "9999:9999"
    volumes:
      - .:/app
    environment:
      - ENV=production

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui-2
    restart: always
    ports:
      - "8050:8080"
    environment:
      - PORT=8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - api-service

volumes:
  open-webui-data: